<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22315A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="발음 트레이너">
<title>소리튠 발음 트레이너</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F5F3EE;--card:#FFFFFF;--ink:#1D2742;--sub:#5D6478;--mute:#9AA0AE;--line:#E7E3DA;
  --navy:#22315A;--navy-btn:#2A3B6B;--ref:#2A3B6B;--coral:#E5604F;--coral-soft:#FCE9E6;
  --good:#2E9A6B;--good-soft:#E3F4EC;--warn:#D9822B;--warn-soft:#FBEFE2;--bad:#D64545;--bad-soft:#FBE7E7;
  --chip:#EFECE5;--shadow:0 1px 2px rgba(29,39,66,.06),0 6px 20px rgba(29,39,66,.06);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11141B;--card:#1A1F2C;--ink:#E9ECF3;--sub:#AEB5C6;--mute:#6F7689;--line:#2A3043;
  --navy:#C9D4FF;--navy-btn:#3B5094;--ref:#9DB2FF;--coral:#F07563;--coral-soft:#3A2420;
  --good:#4CC28F;--good-soft:#173326;--warn:#E9A256;--warn-soft:#3A2A17;--bad:#F06A6A;--bad-soft:#3A1C1C;
  --chip:#252B3B;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy-btn)}
textarea{resize:vertical;min-height:96px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(12px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
.top{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:8px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--chip)}
.ib svg{width:24px;height:24px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;font-weight:700;background:var(--navy-btn);color:#fff;width:100%}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.coral{background:var(--coral)}
.btn.sm{height:40px;padding:0 14px;border-radius:12px;font-size:14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.muted{color:var(--sub)}
.small{font-size:13px}
.center{text-align:center}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.logo{display:block}
.logo .b{transform-box:fill-box;transform-origin:center}
.logo.anim .b{animation:eq 1.1s ease-in-out infinite}
.logo.anim .b2{animation-delay:.15s}.logo.anim .b3{animation-delay:.3s}.logo.anim .b4{animation-delay:.45s}.logo.anim .b5{animation-delay:.6s}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.logo.anim .b{animation:none}}
/* entry */
.entry{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.entry h2{font-size:24px;margin:8px 0 0;letter-spacing:-.3px}
.entry p{margin:0 0 10px}
/* list */
.mat{display:block;width:100%;text-align:left}
.mat h3{margin:0 0 4px;font-size:17px}
.bar{height:8px;border-radius:8px;background:var(--chip);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--coral);border-radius:8px}
.sl{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.sl:last-child{border-bottom:0}
.sl .no{flex:none;width:28px;height:28px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.sl .tx{flex:1;min-width:0;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{flex:none;min-width:44px;height:28px;padding:0 9px;border-radius:14px;display:inline-grid;place-items:center;font-size:13px;font-weight:800;background:var(--chip);color:var(--sub)}
.pill.hi{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.lo{background:var(--bad-soft);color:var(--bad)}
/* practice */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--chip);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--sub)}
.chip.on{background:var(--navy-btn);color:#fff}
.chip svg{width:13px;height:13px;flex:none}
.chip[disabled]{opacity:.45}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vtx b{font-size:15px}
.vpv{flex:none}
.rrow.off{opacity:.5}
.rrow .chips select{border-radius:10px;padding:0 8px;font-size:13px}
.sent{font-size:22px;line-height:1.55;font-weight:600;letter-spacing:-.2px;margin:12px 0 6px;word-break:keep-all}
.sent .w{border-radius:6px;padding:0 1px;transition:background .15s}
.sent .s2{color:var(--coral);font-weight:800}
.sent .s1{font-weight:700}
.sent .now{background:var(--coral-soft)}
.sent .weak{background:var(--bad-soft);text-decoration:underline wavy var(--bad);text-underline-offset:5px}
.sent .strong{text-decoration:underline wavy var(--warn);text-underline-offset:5px}
.sent .good{text-decoration:underline var(--good) 2px;text-underline-offset:5px}
.sent .pz{color:var(--mute);font-weight:400;margin:0 2px}
.sent .pz.miss{color:var(--bad);font-weight:800}
.ipa{font-family:"Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Lucida Grande","Segoe UI",Arial,sans-serif;font-size:16px;color:var(--sub);line-height:1.6;word-break:break-word}
.ipa .st2{color:var(--coral);font-weight:700}
.ipa .st1{color:var(--ink);font-weight:600}
.ipa .bar2{color:var(--mute);margin:0 3px}
.memo{margin-top:8px;font-size:14px;color:var(--sub);background:var(--chip);border-radius:10px;padding:6px 10px;display:inline-block}
.graphwrap{position:relative;margin-top:4px}
canvas.graph{width:100%;height:180px;display:block;border-radius:14px;background:var(--bg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.ctl{display:flex;gap:8px;margin-top:14px}
.ctl button{flex:1;height:46px;border-radius:13px;background:var(--chip);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.ctl button svg{width:20px;height:20px}
.ctl button.playing{background:var(--navy-btn);color:#fff}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 6px}
.mic{width:84px;height:84px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(229,96,79,.35);position:relative}
.mic svg{width:36px;height:36px}
.mic.rec{background:var(--bad)}
.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);opacity:.5;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.mic.busy{background:var(--mute);box-shadow:none}
.hint{font-size:14px;color:var(--sub);text-align:center;min-height:21px}
.score{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.ck{font-size:13px;font-weight:600;padding:6px 8px;border-radius:10px;background:var(--chip);display:flex;align-items:center;gap:6px}
.ck.ok{background:var(--good-soft);color:var(--good)}
.ck.no{background:var(--bad-soft);color:var(--bad)}
.ck.so{background:var(--warn-soft);color:var(--warn)}
.tips{margin:14px 0 4px;padding:0;list-style:none}
.tips li{padding:10px 12px;border-radius:12px;background:var(--bg);margin-bottom:8px;font-size:15px;display:flex;gap:8px}
.tips li::before{content:"✎";color:var(--coral);font-weight:800}
.goods{font-size:14px;color:var(--good);font-weight:600}
.nav{display:flex;gap:8px;margin-top:12px}
/* admin */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;height:42px;border-radius:12px;background:var(--chip);font-weight:700;font-size:14px}
.tabs button.on{background:var(--navy-btn);color:#fff}
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.ed{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--bg)}
.ed .h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:6px}
.ed input,.ed textarea{padding:9px 11px;font-size:15px;margin-bottom:6px}
.ed textarea{min-height:64px}
.ed .ipa-in{font-family:"Charis SIL","Doulos SIL","Noto Sans","Segoe UI",Arial,sans-serif}
.wchips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.wc{font-size:12px;padding:2px 7px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.wc.s2{border-color:var(--coral);color:var(--coral);font-weight:700}
.wc.no{border-style:dashed;color:var(--mute)}
.wc .pp{color:var(--mute);margin-left:3px}
.warn{display:flex;flex-wrap:wrap;gap:4px}
.warn span{font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + var(--safe-b))}
.kbar{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.kbar a{color:var(--ink);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.prog{height:10px;border-radius:10px;background:var(--chip);overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--navy-btn);transition:width .3s}
.empty{padding:28px 8px;text-align:center;color:var(--sub)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.tg{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--navy-btn)}
.tg.on::after{left:25px}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="hwp.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
